services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data


  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    image: northstar-airflow:3.3.1

    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      NORTHSTAR_SQL_SERVER: host.docker.internal
      NORTHSTAR_SQL_DRIVER: ODBC Driver 18 for SQL Server
      NORTHSTAR_SOURCE_DATABASE: NorthstarCommerce
      NORTHSTAR_WAREHOUSE_DATABASE: NorthstarWarehouse
      NORTHSTAR_SQL_USERNAME: ${NORTHSTAR_SQL_USERNAME}
      NORTHSTAR_SQL_PASSWORD: ${NORTHSTAR_SQL_PASSWORD}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: northstar-airflow-local-jwt-secret-change-me
      AIRFLOW__API__SECRET_KEY: northstar-airflow-local-api-secret-change-me

      _AIRFLOW_DB_MIGRATE: "true"


    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins


  airflow-apiserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    image: northstar-airflow:3.3.1
    command: api-server
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      NORTHSTAR_SQL_SERVER: host.docker.internal
      NORTHSTAR_SQL_DRIVER: ODBC Driver 18 for SQL Server
      NORTHSTAR_SOURCE_DATABASE: NorthstarCommerce
      NORTHSTAR_WAREHOUSE_DATABASE: NorthstarWarehouse
      NORTHSTAR_SQL_USERNAME: ${NORTHSTAR_SQL_USERNAME}
      NORTHSTAR_SQL_PASSWORD: ${NORTHSTAR_SQL_PASSWORD}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: northstar-airflow-local-jwt-secret-change-me
      AIRFLOW__API__SECRET_KEY: northstar-airflow-local-api-secret-change-me     
    ports:
      - "8080:8080"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins

    restart: unless-stopped


  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    image: northstar-airflow:3.3.1
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      NORTHSTAR_SQL_SERVER: host.docker.internal
      NORTHSTAR_SQL_DRIVER: ODBC Driver 18 for SQL Server
      NORTHSTAR_SOURCE_DATABASE: NorthstarCommerce
      NORTHSTAR_WAREHOUSE_DATABASE: NorthstarWarehouse
      NORTHSTAR_SQL_USERNAME: ${NORTHSTAR_SQL_USERNAME}
      NORTHSTAR_SQL_PASSWORD: ${NORTHSTAR_SQL_PASSWORD}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: northstar-airflow-local-jwt-secret-change-me
      AIRFLOW__API__SECRET_KEY: northstar-airflow-local-api-secret-change-me

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins

    restart: unless-stopped


  airflow-dag-processor:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    image: northstar-airflow:3.3.1
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin    
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"  
      NORTHSTAR_SQL_SERVER: host.docker.internal
      NORTHSTAR_SQL_DRIVER: ODBC Driver 18 for SQL Server
      NORTHSTAR_SOURCE_DATABASE: NorthstarCommerce
      NORTHSTAR_WAREHOUSE_DATABASE: NorthstarWarehouse
      NORTHSTAR_SQL_USERNAME: ${NORTHSTAR_SQL_USERNAME}
      NORTHSTAR_SQL_PASSWORD: ${NORTHSTAR_SQL_PASSWORD}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: northstar-airflow-local-jwt-secret-change-me
      AIRFLOW__API__SECRET_KEY: northstar-airflow-local-api-secret-change-me

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins

    restart: unless-stopped


  airflow-triggerer:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    image: northstar-airflow:3.3.1
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      NORTHSTAR_SQL_SERVER: host.docker.internal
      NORTHSTAR_SQL_DRIVER: ODBC Driver 18 for SQL Server
      NORTHSTAR_SOURCE_DATABASE: NorthstarCommerce
      NORTHSTAR_WAREHOUSE_DATABASE: NorthstarWarehouse
      NORTHSTAR_SQL_USERNAME: ${NORTHSTAR_SQL_USERNAME}
      NORTHSTAR_SQL_PASSWORD: ${NORTHSTAR_SQL_PASSWORD}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__API_AUTH__JWT_SECRET: northstar-airflow-local-jwt-secret-change-me
      AIRFLOW__API__SECRET_KEY: northstar-airflow-local-api-secret-change-me

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins

    restart: unless-stopped


volumes:
  airflow-postgres-data: