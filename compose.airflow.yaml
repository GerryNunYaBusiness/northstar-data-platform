x-airflow-common-env: &airflow-common-env
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  AIRFLOW__API_AUTH__JWT_SECRET: northstar-airflow-local-jwt-secret-change-me
  AIRFLOW__API__SECRET_KEY: northstar-airflow-local-api-secret-change-me

  NORTHSTAR_SQL_SERVER: host.docker.internal
  #NORTHSTAR_SQL_SERVER: does-not-exist
  NORTHSTAR_SQL_DRIVER: ODBC Driver 18 for SQL Server
  NORTHSTAR_SOURCE_DATABASE: NorthstarCommerce
  NORTHSTAR_WAREHOUSE_DATABASE: NorthstarWarehouse
  NORTHSTAR_SQL_USERNAME: ${NORTHSTAR_SQL_USERNAME}
  NORTHSTAR_SQL_PASSWORD: ${NORTHSTAR_SQL_PASSWORD}

  #NORTHSTAR_CUSTOMER_INVALID_RATE_THRESHOLD: "0"
  NORTHSTAR_CUSTOMER_INVALID_RATE_THRESHOLD: "0.05"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: northstar-airflow:3.3.1
  environment:
    <<: *airflow-common-env
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    restart: unless-stopped   
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped 
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: unless-stopped 
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: unless-stopped 
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-postgres-data: