name: Python Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v
  
  integration-tests:
    name: SQL Server Integration Tests
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "NorthstarIntegration!2026_Test"
        ports:
          - 1433:1433

    env:
      NORTHSTAR_SQL_SERVER: localhost,1433
      NORTHSTAR_SQL_DRIVER: ODBC Driver 18 for SQL Server

      NORTHSTAR_INTEGRATION_SQL_PASSWORD: "NorthstarIntegration!2026_Test"

      NORTHSTAR_SQL_USERNAME: northstar_pipeline
      NORTHSTAR_SQL_PASSWORD: "NorthstarPipeline!2026_Test"

      NORTHSTAR_SOURCE_DATABASE: NorthstarCommerce_IntegrationTest
      NORTHSTAR_WAREHOUSE_DATABASE: NorthstarWarehouse_IntegrationTest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Microsoft ODBC Driver
        shell: bash
        run: |
          set -e

          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | gpg --batch --yes --dearmor \
            | sudo tee /usr/share/keyrings/microsoft-prod.gpg > /dev/null

          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null

          sudo apt-get update

          sudo ACCEPT_EULA=Y apt-get install -y \
            msodbcsql18

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Wait for SQL Server
        shell: bash
        run: |
          python - <<'PY'
          import os
          import time
          import pyodbc

          connection_string = (
              "DRIVER={ODBC Driver 18 for SQL Server};"
              "SERVER=localhost,1433;"
              "DATABASE=master;"
              "UID=sa;"
              f"PWD={os.environ['NORTHSTAR_INTEGRATION_SQL_PASSWORD']};"
              "Encrypt=yes;"
              "TrustServerCertificate=yes;"
          )

          for attempt in range(1, 31):
              try:
                  connection = pyodbc.connect(
                      connection_string,
                      timeout=2,
                  )
                  connection.close()

                  print("SQL Server is ready.")
                  break

              except pyodbc.Error as exc:
                  print(
                      f"Attempt {attempt}: "
                      f"SQL Server not ready yet."
                  )

                  if attempt == 30:
                      raise

                  time.sleep(2)
          PY
       
      - name: Run integration tests
        run: |
          python -m pytest integration_tests -v